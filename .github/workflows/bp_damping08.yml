# BP comparison rerun at damping 0.8 (better for BP in the damping check), same outbreaks as the main table.
name: bp-damping-0.8
on:
  workflow_dispatch:
  push:
    branches: [revision/ojcs-reviews]
    paths: [.github/workflows/bp_damping08.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {name: bp08-hospital-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Hospital' 0.1 40 101 true & done; wait"}
          - {name: bp08-hospital-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Hospital' 0.1 40 102 true & done; wait"}
          - {name: bp08-hospital-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Hospital' 0.1 40 103 true & done; wait"}
          - {name: bp08-hospital-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Hospital' 0.1 40 104 true & done; wait"}
          - {name: bp08-hospital-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Hospital' 0.1 40 105 true & done; wait"}
          - {name: bp08-primary-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Primary school' 0.1 40 101 true & done; wait"}
          - {name: bp08-primary-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Primary school' 0.1 40 102 true & done; wait"}
          - {name: bp08-primary-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Primary school' 0.1 40 103 true & done; wait"}
          - {name: bp08-primary-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Primary school' 0.1 40 104 true & done; wait"}
          - {name: bp08-primary-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Primary school' 0.1 40 105 true & done; wait"}
          - {name: bp08-office-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Office' 0.1 40 101 true & done; wait"}
          - {name: bp08-office-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Office' 0.1 40 102 true & done; wait"}
          - {name: bp08-office-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Office' 0.1 40 103 true & done; wait"}
          - {name: bp08-office-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Office' 0.1 40 104 true & done; wait"}
          - {name: bp08-office-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Office' 0.1 40 105 true & done; wait"}
          - {name: bp08-high_school-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'High school' 0.1 40 101 true & done; wait"}
          - {name: bp08-high_school-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'High school' 0.1 40 102 true & done; wait"}
          - {name: bp08-high_school-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'High school' 0.1 40 103 true & done; wait"}
          - {name: bp08-high_school-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'High school' 0.1 40 104 true & done; wait"}
          - {name: bp08-high_school-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'High school' 0.1 40 105 true & done; wait"}
          - {name: bp08-email-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Email-Eu' 0.1 40 101 true & done; wait"}
          - {name: bp08-email-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Email-Eu' 0.1 40 102 true & done; wait"}
          - {name: bp08-email-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Email-Eu' 0.1 40 103 true & done; wait"}
          - {name: bp08-email-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Email-Eu' 0.1 40 104 true & done; wait"}
          - {name: bp08-email-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'Email-Eu' 0.1 40 105 true & done; wait"}
          - {name: bp08-college-101, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'CollegeMsg' 0.1 40 101 true & done; wait"}
          - {name: bp08-college-102, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'CollegeMsg' 0.1 40 102 true & done; wait"}
          - {name: bp08-college-103, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'CollegeMsg' 0.1 40 103 true & done; wait"}
          - {name: bp08-college-104, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'CollegeMsg' 0.1 40 104 true & done; wait"}
          - {name: bp08-college-105, cmd: "for i in 0 1 2 3; do BP_DAMPING=0.8 SHARD=$i/4 python -W ignore -m experiments.compare_bp 'CollegeMsg' 0.1 40 105 true & done; wait"}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy networkx
      - if: startsWith(matrix.name, 'bp08-')
        run: pip install "git+https://github.com/sibyl-team/sib.git@5b762da"
      - if: startsWith(matrix.name, 'x5-')
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Data (SNAP, Netzschleuder)
        run: |
          mkdir -p data/raw/temporal data/raw/sociopatterns
          for f in CollegeMsg.txt.gz email-Eu-core-temporal.txt.gz sx-mathoverflow.txt.gz sx-askubuntu.txt.gz; do curl -sSfL "https://snap.stanford.edu/data/$f" -o "data/raw/temporal/$f"; done
          for n in sp_hospital sp_office sp_primary_school; do curl -sSfL "https://networks.skewed.de/net/$n/files/$n.csv.zip" -o "data/raw/sociopatterns/$n.csv.zip"; done
          curl -sSfL "https://networks.skewed.de/net/sp_high_school_new/files/2012.csv.zip" -o data/raw/sociopatterns/sp_high_school_2012.csv.zip
      - run: |
          ${{ matrix.cmd }}
          n=$(find outputs/bp_comparison -newer README.md -name '*.jsonl' 2>/dev/null | wc -l)
          echo "result files written: $n"; test "$n" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: outputs/bp_comparison/*_damping0.8_*.jsonl
