# Biazzo et al. 2022 comparison, stage C fill: Office outbreaks 20-23 (job office-0 hit the 6 h limit): Hospital and Office, 40 outbreaks each, 3000 x 1000 (docs/ieee_trans_review.md section 11). Runs when this file changes.
name: ann-biazzo
on:
  workflow_dispatch:
  push:
    branches: [revision/ojcs-reviews]
    paths: [.github/workflows/ann_biazzo.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ann-c-office-fill, cmd: "for i in 20 21 22 23; do SHARD=$i/40 python -W ignore -m experiments.compare_ann run Office 40 3000 1000 & done; wait"}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install "numpy>=2" scipy networkx pandas
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "git+https://github.com/ocadni/annfore.git@ee39c69160b4445ea477e378a7876cf0e786767b"
      - name: Data (Netzschleuder)
        run: |
          mkdir -p data/raw/sociopatterns
          for n in sp_hospital sp_office; do curl -sSfL "https://networks.skewed.de/net/$n/files/$n.csv.zip" -o "data/raw/sociopatterns/$n.csv.zip"; done
      - run: |
          ${{ matrix.cmd }}
          n=$(find outputs/ann_comparison -name '*.jsonl' -newer README.md 2>/dev/null | wc -l)
          echo "result files written: $n"; test "$n" -gt 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: outputs/ann_comparison/*of*.jsonl
