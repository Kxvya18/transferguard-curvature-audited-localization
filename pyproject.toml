[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mean-field-localization"
version = "0.1.0"
description = "Mean-field source localization on evolving networks with sparse, timed observers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "torch>=2.5",
]
