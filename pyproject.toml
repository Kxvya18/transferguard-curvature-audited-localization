[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transferguard"
version = "0.1.0"
description = "Physics-informed attack-origin localization for unseen IoT networks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "torch>=2.5",
]

[project.optional-dependencies]
journal = [
  "matplotlib>=3.8",
  "tgm-lib==0.1.0b1",
  "torch-geometric>=2.6.1",
]
